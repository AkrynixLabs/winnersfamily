<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 140 400 280" role="img" aria-label="Winners Family School emblem">
  <defs>
    <path id="motto-curve" d="M43.7 311.1 A204 204 0 0 0 356.3 311.1"/>
    <!-- hide anything that passes behind the ribbon -->
    <mask id="behind-ribbon" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="460">
      <rect x="0" y="0" width="400" height="460" fill="#fff"/>
      <path d="M62.1 295.7 A180 180 0 0 0 337.9 295.7 L374.7 326.6 A228 228 0 0 1 25.3 326.6 Z" fill="#000" stroke="#000" stroke-width="6"/>
    </mask>
  </defs>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Centre panel: two top quarters + rounded lower section -->
    <g mask="url(#behind-ribbon)">
      <path d="M106 152 H294 V256 C294 318 254 344 200 344 C146 344 106 318 106 256 Z" stroke="#F5C518" stroke-width="9"/>
      <path d="M106 246 H294 M200 152 V246" stroke="#F5C518" stroke-width="9"/>
    </g>

    <!-- Torch -->
    <path d="M144 236 H160 L165 208 H139 Z" fill="#F5C518" stroke="#F5C518" stroke-width="3"/>
    <path d="M133 199 H171 L167 208 H137 Z" fill="#F5C518" stroke="#F5C518" stroke-width="3"/>
    <path d="M152 162 C150 172 156 176 154 184 C160 178 158 170 162 166 C166 176 170 184 165 196 H139 C134 186 138 176 143 170 C143 178 146 182 149 184 C147 176 146 168 152 162 Z"
          fill="#F5C518" stroke="#F5C518" stroke-width="3"/>

    <!-- Praying hands (tilted, as on the badge) -->
    <g transform="rotate(-24 252 200)">
      <path d="M250 158 C246 161 243 172 241 184 C239 196 238 206 236 214 C235 220 238 224 243 224 H250 Z"
            fill="none" stroke="#F5C518" stroke-width="4.8"/>
      <path d="M252 158 C256 161 259 172 261 184 C263 196 264 206 266 214 C267 220 264 224 259 224 H252 Z"
            fill="none" stroke="#F5C518" stroke-width="4.8"/>
      <path d="M246 170 L244 196 M256 170 L258 196" stroke="#F5C518" stroke-width="3"/>
      <path d="M243 202 C239 208 240 216 246 219 M259 202 C263 208 262 216 256 219" stroke="#F5C518" stroke-width="3"/>
    </g>
    <path d="M250 230 L282 214 L290 226 L258 242 Z" fill="#F5C518" stroke="#F5C518" stroke-width="3"/>

    <!-- Open book -->
    <path d="M200 278 C186 268 166 267 148 271 V312 C166 308 186 309 200 318 Z" fill="none" stroke="#F5C518" stroke-width="7.5"/>
    <path d="M200 278 C214 268 234 267 252 271 V312 C234 308 214 309 200 318 Z" fill="none" stroke="#F5C518" stroke-width="7.5"/>
    <path d="M142 314 C164 311 186 313 200 324 C214 313 236 311 258 314" stroke="#F5C518" stroke-width="7.5"/>
    <path d="M160 285 C171 283 182 284 191 289 M160 298 C171 296 182 297 191 302
             M240 285 C229 283 218 284 209 289 M240 298 C229 296 218 297 209 302"
          stroke="#F5C518" stroke-width="4.5"/>

    <!-- Motto ribbon: concentric arcs so the band is an even width all the way round -->
    <path d="M62.1 295.7 L42.8 272.7 L32.8 298.1 L6.1 303.6 L25.3 326.6 Z" fill="none" stroke="#F5C518" stroke-width="7.5"/>
    <path d="M337.9 295.7 L357.2 272.7 L367.2 298.1 L393.9 303.6 L374.7 326.6 Z" fill="none" stroke="#F5C518" stroke-width="7.5"/>
    <path d="M62.1 295.7 A180 180 0 0 0 337.9 295.7 L374.7 326.6 A228 228 0 0 1 25.3 326.6 Z" fill="none" stroke="#F5C518" stroke-width="7.5"/>
  </g>

  <!-- Lettering -->
  <g fill="#F5C518" font-family="'Arial Black', 'Arial', 'Helvetica', sans-serif" font-weight="900" text-anchor="middle">
    <text font-size="17.5" stroke="#F5C518" stroke-width="0.55" stroke-linejoin="round" dominant-baseline="central">
      <textPath href="#motto-curve" startOffset="50%" textLength="322" lengthAdjust="spacingAndGlyphs">DISCIPLINE, POWER &amp; KNOWLEDGE</textPath>
    </text>
  </g>
</svg>
